# Self-host everything on one Linux VPS: the app, HTTPS (Caddy) and a TURN relay (coturn).
# 1. Point APP_DOMAIN and TURN_DOMAIN DNS A records at the server.
# 2. cp .env.example .env  and fill in SESSION_SECRET, TURN_SECRET, APP_DOMAIN, TURN_DOMAIN, PUBLIC_IP.
# 3. Open ports: 80/tcp, 443/tcp, 443/udp, 3478/tcp, 3478/udp, 49160-49200/udp.
# 4. docker compose up -d --build

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /data
      TRUST_PROXY: 1
      FORCE_HTTPS: "false"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      TURN_URLS: turn:${TURN_DOMAIN}:3478?transport=udp,turn:${TURN_DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      TURN_TTL: ${TURN_TTL:-43200}
    volumes:
      - duet-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking: TURN needs a wide UDP port range, which is slow through Docker's proxy.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_DOMAIN}
      - --external-ip=${PUBLIC_IP}
      - --no-cli
      - --no-multicast-peers
      - --no-tlsv1
      - --no-tlsv1_1
      # Never relay into private networks (stops the relay being used to reach your server's internals).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --total-quota=200
      - --user-quota=12

volumes:
  duet-data:
  caddy-data:
  caddy-config:
