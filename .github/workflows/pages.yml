# Publishes the front end (public/) to GitHub Pages on every push to main.
# One-time setup in the repo on github.com:
#   1. Settings > Pages > Build and deployment > Source: GitHub Actions
#   2. Settings > Secrets and variables > Actions > Variables > New repository variable
#        DUET_API_URL = https://<your-server>.onrender.com   (the hosted server.js)
name: Deploy front end to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages template: the deploy job starts only after the build
# job has finished uploading, so it never looks for the site package before GitHub has it.
# Actions are pinned to exact commits (a moved or hijacked tag can't change what runs);
# Dependabot keeps them up to date, see .github/dependabot.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build site and point it at the server
        env:
          DUET_API_URL: ${{ vars.DUET_API_URL }}
        run: |
          mkdir -p site
          cp -r public/. site/
          if [ -z "$DUET_API_URL" ]; then
            echo "::warning::DUET_API_URL repository variable is not set, so the site can't reach a server yet."
          fi
          node -e 'const u=(process.env.DUET_API_URL||"").trim().replace(/\/+$/,""); require("fs").writeFileSync("site/config.js", "window.DUET_CONFIG = { apiBase: " + JSON.stringify(u) + " };\n")'
          cat site/config.js
          touch site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
